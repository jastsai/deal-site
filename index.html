<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Deal Intelligence</title>
<style>
:root{
  --paper:#f4f1ea; --ink:#22201c; --muted:#6f6a60; --line:#e0dacd;
  --green:#1f6f54; --gold:#c08a1e; --clay:#b4523a; --card:#fffdf8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(40,32,16,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font:16px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.num,.price,.metric b,.score{font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 64px}

/* gate */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gatecard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:34px 30px;max-width:380px;width:100%;text-align:center}
.gatecard .lock{font-size:34px}
.gatecard h1{font:600 20px/1.2 Georgia,serif;margin:12px 0 4px}
.gatecard p{color:var(--muted);margin:0 0 18px;font-size:14px}
.gatecard input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;background:#fff}
.gatecard button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;
  background:var(--green);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.gatecard button:hover{filter:brightness(1.06)}
.gateerr{color:var(--clay);font-size:13px;min-height:18px;margin-top:10px}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;margin-top:12px}

/* masthead */
.masthead{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:24px}
.kicker{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--green);font-weight:700}
.masthead h1{font:700 clamp(30px,6vw,46px)/1.02 Georgia,"Iowan Old Style",serif;margin:6px 0 8px}
.masthead h1 .best{font-style:italic;color:var(--green)}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dot{opacity:.5}
.deals{margin-top:12px;font-size:13px;color:var(--muted)}
.deal-link{display:inline-block;margin-left:8px;padding:3px 10px;border:1px solid var(--green);
  border-radius:999px;color:var(--green);text-decoration:none;font-weight:600}
.deal-link:hover{background:var(--green);color:#fff}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.tab{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font:600 14px/1 ui-sans-serif,system-ui;padding:9px 16px;border-radius:999px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.panelhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.cattitle{font:700 clamp(22px,4vw,30px)/1.05 Georgia,serif;margin:0}
.cattitle .best{font-style:italic;color:var(--green)}
.facts{font-size:12px;color:var(--muted);margin-bottom:8px}

/* narrative */
.narrative{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:12px;padding:16px 18px;margin-bottom:26px;box-shadow:var(--shadow)}
.narrative p{margin:0;font-size:15.5px}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
@media(max-width:760px){.podium{grid-template-columns:1fr}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 18px 16px;box-shadow:var(--shadow);overflow:hidden}
.card.rank0{border-color:var(--gold);box-shadow:0 0 0 2px rgba(192,138,30,.25),var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.card.rank0::before{background:var(--gold)}
.card.rank1::before{background:#9aa3ad}
.card.rank2::before{background:#c08457}
.rankbadge{font-size:26px;line-height:1}
.merchant{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  font-weight:700;margin-top:6px}
.sale{color:var(--clay);text-transform:none;letter-spacing:0;font-weight:600}
.pname{font:600 16px/1.25 Georgia,serif;margin:4px 0 2px}
.also{font-size:12px;color:var(--muted);margin-bottom:6px}
.price{font-size:30px;font-weight:700;margin:6px 0 8px}
.metrics{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.metric b{color:var(--ink)}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.verdict{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.verdict.buy{background:#e6f2ec;color:var(--green)}
.verdict.wait{background:#fbf0da;color:#8a6a12}
.verdict.new{background:#eee;color:var(--muted)}
.scores{display:flex;align-items:baseline;gap:12px;border-top:1px dashed var(--line);padding-top:8px;
  font-size:12px;color:var(--muted)}
.score.big{font-size:26px;font-weight:700;color:var(--green)}

/* sections */
h2{font:600 18px/1.2 Georgia,serif;margin:26px 0 12px;display:flex;gap:10px;align-items:baseline}
h2 .hint,.hint{font:400 12px/1 ui-sans-serif,system-ui;color:var(--muted)}
.avoid ul,.lows ul{list-style:none;padding:0;margin:0}
.avoid li{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);
  border-left:4px solid var(--clay);border-radius:10px;background:var(--card);margin-bottom:8px}
.avoid .an{font-weight:600}.avoid .am{font-size:13px;color:var(--muted)}
.lows li{color:var(--green);padding:2px 0}

/* table */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 11px/1 ui-sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  background:#faf7f0;position:sticky;top:0;user-select:none}
table.sortable th{cursor:pointer}
table.sortable th:hover{color:var(--ink)}
th[data-dir] .ind{color:var(--green);font-weight:700}
.ind{font-size:10px}
td.num{text-align:right}td.strong{font-weight:700;color:var(--green)}
td.vscell{font-weight:600}
.pname-cell{white-space:normal;min-width:220px}
.plus{color:var(--green);font-size:11px}
tbody tr:hover{background:#faf7ef}
.plink{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.plink:hover{color:var(--green);border-color:var(--green)}

/* thumbnails */
.thumb{flex:0 0 auto}
.thumb img{width:64px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:3px}
.card .thumb{position:absolute;top:14px;right:14px}
.card .thumb img{width:52px;height:52px}
.card .merchant,.card .pname,.card .also{padding-right:60px}

/* reference benchmark */
.reference{margin-bottom:24px}
.refcard{display:flex;align-items:center;gap:14px;background:#f0efe7;
  border:1px dashed var(--green);border-radius:12px;padding:12px 16px}
.refbody{flex:1 1 auto}
.reflabel{text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:700;color:var(--green)}
.refname{font:600 15px/1.2 Georgia,serif;margin:2px 0}
.refmetrics{font-size:13px;color:var(--muted)}
.refscore{font:700 24px/1 ui-monospace,monospace;color:var(--green)}

/* vs-Costco badges */
.vs{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}
.vs.cheaper{background:#e6f2ec;color:var(--green)}
.vs.pricier{background:#f6e3dd;color:var(--clay)}
.vs.even{background:#eee;color:var(--muted)}

/* unscored + foot */
.unscored{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.unscored summary{cursor:pointer;font-weight:600;padding:10px 0}
.unscored ul{list-style:none;padding:0;margin:0 0 10px;font-size:13px;color:var(--muted)}
.unscored li{padding:3px 0;border-top:1px solid var(--line)}
.ur{color:var(--clay);font-size:11px}
.foot{margin-top:32px;color:var(--muted);font-size:12px;text-align:center;
  border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div id="gate">
  <form class="gatecard" id="gateform" autocomplete="off">

    <h1>Deal Intelligence</h1>
    <p>This page is encrypted. Enter your password to view this week&#39;s picks.</p>
    <input id="pw" type="password" placeholder="Password" autofocus autocomplete="current-password">
    <button type="submit">Unlock</button>
    <label class="remember"><input type="checkbox" id="remember" checked> Remember for this tab</label>
    <div class="gateerr" id="err"></div>
  </form>
</div>
<div class="wrap" id="app" hidden></div>

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}

function reveal(html_){
  const app = document.getElementById("app");
  app.innerHTML = html_;
  app.hidden = false;
  document.getElementById("gate").style.display = "none";
  document.title = "Deal Intelligence";
  initTabs(app);
  app.querySelectorAll("table.sortable").forEach(t => initSortable(t));
}

// Category tabs
function initTabs(root){
  const tabs = [...root.querySelectorAll(".tab")];
  const panels = [...root.querySelectorAll(".panel")];
  tabs.forEach(tab => tab.addEventListener("click", () => {
    const n = tab.dataset.tab;
    tabs.forEach(t => t.classList.toggle("active", t === tab));
    panels.forEach(p => { p.hidden = (p.dataset.panel !== n); });
  }));
}

// Multi-column sortable table: click a header to sort; shift-click to add a
// secondary/tertiary key. Uses each cell's data-v (raw value) when present.
function initSortable(table){
  if(!table || !table.tHead) return;
  const ths = [...table.tHead.rows[0].cells];
  const tbody = table.tBodies[0];
  let sorts = [{i: 1, dir: "desc"}];   // start on Combined desc (as rendered)

  ths.forEach((th, i) => {
    if(!th.querySelector(".ind")){
      const s = document.createElement("span"); s.className = "ind"; th.appendChild(s);
    }
    th.addEventListener("click", (e) => {
      const ex = sorts.find(s => s.i === i);
      if(e.shiftKey){
        if(ex) ex.dir = ex.dir === "asc" ? "desc" : "asc";
        else sorts.push({i, dir: "asc"});
      } else {
        sorts = [{i, dir: (ex && sorts.length === 1 && ex.dir === "asc") ? "desc" : "asc"}];
      }
      applySort();
    });
  });

  function cellVal(tr, i){
    const td = tr.cells[i];
    const raw = td.getAttribute("data-v");
    const txt = (raw !== null ? raw : td.textContent).trim();
    if(ths[i].dataset.type === "num"){
      if(txt === "") return Number.POSITIVE_INFINITY;   // blanks sort last
      const n = parseFloat(txt.replace(/[^0-9.\-]/g, ""));
      return isNaN(n) ? Number.POSITIVE_INFINITY : n;
    }
    return txt.toLowerCase();
  }

  function applySort(){
    const rows = [...tbody.rows];
    rows.sort((a, b) => {
      for(const s of sorts){
        const av = cellVal(a, s.i), bv = cellVal(b, s.i);
        if(av < bv) return s.dir === "asc" ? -1 : 1;
        if(av > bv) return s.dir === "asc" ? 1 : -1;
      }
      return 0;
    });
    rows.forEach(r => tbody.appendChild(r));
    ths.forEach((th, i) => {
      const idx = sorts.findIndex(s => s.i === i);
      const s = sorts[idx];
      if(s){
        th.setAttribute("data-dir", s.dir);
        th.querySelector(".ind").textContent =
          (s.dir === "asc" ? " \u25B2" : " \u25BC") + (sorts.length > 1 ? (idx + 1) : "");
      } else {
        th.removeAttribute("data-dir");
        th.querySelector(".ind").textContent = "";
      }
    });
  }
  applySort();
}

async function tryUnlock(pw, remember){
  const html_ = await decrypt(pw);           // throws on wrong password
  if(remember){ try{ sessionStorage.setItem("dealpw", pw); }catch(e){} }
  reveal(html_);
}

document.getElementById("gateform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    await tryUnlock(document.getElementById("pw").value,
                    document.getElementById("remember").checked);
  } catch(ex) {
    err.textContent = "Wrong password — try again.";
    document.getElementById("pw").select();
  }
});

// auto-unlock if remembered this tab
(async () => {
  try {
    const saved = sessionStorage.getItem("dealpw");
    if(saved){ await tryUnlock(saved, true); }
  } catch(e){ try{ sessionStorage.removeItem("dealpw"); }catch(_){} }
})();
</script>
